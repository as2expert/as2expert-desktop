[package]
name = "as2expert-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.76"
description = "Native cross-platform desktop client for AS2Expert — read, organize, send and receive AS2/EDI messages."
license = "Apache-2.0"
repository = "https://github.com/as2expert/as2expert-desktop"
homepage = "https://github.com/as2expert/as2expert-desktop"
keywords = ["as2", "edi", "edifact", "gui", "as2expert"]
categories = ["gui"]
readme = "README.md"

[[bin]]
name = "as2expert-desktop"
path = "src/main.rs"

[dependencies]
# Native, dependency-light GUI: OpenGL (glow) backend, no web/webview stack.
eframe = { version = "0.29", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
] }
# The AS2Expert Rust SDK (async client) drives every API call.
as2expert = { git = "https://github.com/as2expert/as2expert-rust", branch = "main" }
# A shared multi-threaded runtime lets API calls run off the UI thread.
tokio = { version = "1", features = ["rt-multi-thread"] }
serde_json = "1"

[profile.release]
strip = true
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
