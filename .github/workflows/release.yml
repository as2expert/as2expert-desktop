name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: as2expert-desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: as2expert-desktop-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: as2expert-desktop-windows-x86_64.zip
          - os: macos-14
            target: universal-apple-darwin
            asset: as2expert-desktop-macos-universal.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgtk-3-dev pkg-config

      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          tar -C target/x86_64-unknown-linux-gnu/release -czf "${{ matrix.asset }}" "$BIN"

      - name: Build + package (Windows, with software-GL for RDP)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release --target x86_64-pc-windows-msvc
          New-Item -ItemType Directory -Force -Path pkg/mesa | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/$env:BIN.exe" pkg/
          # Bundle Mesa's llvmpipe software OpenGL so remote-desktop (RDP) users
          # get a working renderer. The app loads it only when a remote session
          # is detected; local users keep hardware acceleration.
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "as2expert-ci" }
          $releases = Invoke-RestMethod -Headers $headers "https://api.github.com/repos/pal1000/mesa-dist-win/releases?per_page=15"
          $asset = $releases.assets `
            | Where-Object { $_.name -like "*release-msvc.7z" } | Select-Object -First 1
          if (-not $asset) {
            $asset = ($releases | ForEach-Object { $_.assets } `
              | Where-Object { $_.name -like "*release-msvc.7z" } | Select-Object -First 1)
          }
          Write-Host "Mesa asset: $($asset.name)"
          Invoke-WebRequest -Headers $headers $asset.browser_download_url -OutFile mesa.7z
          7z x mesa.7z -omesa_x -y | Out-Null
          # Only the DLLs llvmpipe software OpenGL actually needs (keeps the
          # download small); copy each if the Mesa build provides it.
          foreach ($dll in @("opengl32.dll","libgallium_wgl.dll","libglapi.dll")) {
            if (Test-Path "mesa_x/x64/$dll") { Copy-Item "mesa_x/x64/$dll" pkg/mesa/ }
          }
          7z a "${{ matrix.asset }}" ./pkg/*

      - name: Build (macOS universal)
        if: matrix.os == 'macos-14'
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          mkdir -p dist
          lipo -create -output "dist/$BIN" \
            "target/x86_64-apple-darwin/release/$BIN" \
            "target/aarch64-apple-darwin/release/$BIN"
          tar -C dist -czf "${{ matrix.asset }}" "$BIN"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
